name: Release VioletWire

on:
  push:
    tags:
      - "v*"

# Jobs opt into only the permissions they need. In particular, dependency
# installation and native compilation never run with a release-write token.
permissions: {}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # actions/checkout v7, pinned so a moved tag cannot change CI code.
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Node.js
        # actions/setup-node v7
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm test

      - name: Build Windows installer
        run: npm run release:win
        env:
          # Add these repository secrets when a Windows signing certificate is
          # available. Empty secrets leave local/alpha builds unsigned.
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_PUBLISHER_NAME: ${{ secrets.WINDOWS_PUBLISHER_NAME }}

      - name: Prepare immutable release payload
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          $escapedVersion = [regex]::Escape($version)
          $releaseNotes = [regex]::Match(
            $changelog,
            "(?ms)^## \[$escapedVersion\].*?(?=^## \[|\z)"
          )
          if (-not $releaseNotes.Success) {
            throw "CHANGELOG.md does not contain release notes for $version."
          }
          $releaseNotes.Value.Trim() | Set-Content release/release-notes.md -Encoding utf8
          $version | Set-Content release/version.txt -Encoding ascii

      - name: Upload verified release payload
        # actions/upload-artifact v6
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: violetwire-windows-release
          if-no-files-found: error
          retention-days: 2
          path: |
            release/VioletWire-Setup-*.exe
            release/VioletWire-Setup-*.exe.blockmap
            release/latest.yml
            release/release-notes.md
            release/version.txt

  publish:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release payload
        # actions/download-artifact v7
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: violetwire-windows-release
          path: release

      - name: Publish immutable GitHub release
        shell: pwsh
        run: |
          $version = (Get-Content release/version.txt -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match artifact version $version."
          }
          if (gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null) {
            throw "Release $env:GITHUB_REF_NAME already exists. Release assets are immutable; publish a newer version."
          }
          $assets = @(
            "release/VioletWire-Setup-$version-x64.exe",
            "release/VioletWire-Setup-$version-x64.exe.blockmap",
            "release/latest.yml"
          )
          gh release create $env:GITHUB_REF_NAME @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title $version `
            --latest `
            --notes-file release/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
