name: Release VioletWire

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run lint
          npm test

      - name: Build Windows installer
        run: npm run release:win

      - name: Publish GitHub prerelease
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $assets = @(
            "release/VioletWire-Setup-$version-x64.exe",
            "release/VioletWire-Setup-$version-x64.exe.blockmap",
            "release/latest.yml"
          )
          if (gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $env:GITHUB_REF_NAME @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:GITHUB_REF_NAME @assets `
              --repo $env:GITHUB_REPOSITORY `
              --title $version `
              --prerelease `
              --notes "Initial release."
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
