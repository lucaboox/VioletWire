[package]
name = "violetwire"
version = "0.1.0"
description = "VioletWire, a Windows Twitch viewer, rebuilt in Rust with GPUI"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
# Audio output through WASAPI.
cpal = "0.18.2"
gpui = "0.2.2"
# Video frames are handed to GPUI as image buffers.
image = { version = "0.25", default-features = false }
# Windows Credential Manager, the same store Windows uses for its own sign-ins.
keyring = { version = "3.6", features = ["windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3.5", features = ["json"] }
# A Job object ties Streamlink and FFmpeg to the app's lifetime.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Time", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_Media_Audio", "Win32_UI_Shell_PropertiesSystem"] }
windows-core = "0.61"
native-tls = "0.2"
unicode-segmentation = "1"
# Kick's badge artwork is SVG; GPUI already builds resvg.
resvg = { version = "0.45.1", default-features = false }
wry = { version = "0.57.2", default-features = false }
tungstenite = { version = "0.30.0", default-features = false, features = ["native-tls", "handshake"] }

[build-dependencies]
winresource = "0.1.34"
